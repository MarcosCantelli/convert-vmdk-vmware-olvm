##############################################################################
# ansible.cfg — configuração local do projeto.
# Só tem efeito quando o ansible é executado COM ESTE DIRETÓRIO como cwd
# (ex.: `cd ansible && ansible-playbook migrate-single.yml`).
##############################################################################

[defaults]
# Inventário padrão: não precisamos passar -i em toda execução.
inventory = inventory/hosts.yml

# Onde ficam roles e coleções instaladas pelo requirements.yml.
# O diretório collections/ está no .gitignore — é artefato de build.
roles_path = roles
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections

# Laboratório com hosts recriados com frequência: não travar em host key.
# Em produção, prefira gerenciar o known_hosts e deixar isto como True.
host_key_checking = False

# Saída legível: resultados em YAML em vez de JSON de uma linha.
# Usamos o callback nativo `default` com callback_result_format=yaml.
# (o antigo `stdout_callback = yaml`, da community.general, foi REMOVIDO na
#  versão 12 da coleção — não use.)
stdout_callback = default
callback_result_format = yaml

# Evita o aviso de descoberta de interpretador Python em Oracle Linux / ESXi.
interpreter_python = auto_silent

# Arquivos .retry só poluem o repositório.
retry_files_enabled = False

# Conversões de disco são LONGAS: aumentamos os timeouts padrão.
timeout = 60

# Não definimos vault_password_file aqui de propósito: a senha do vault chega
# via `--vault-password-file` (Jenkins credential) ou `--ask-vault-pass`.

[ssh_connection]
# pipelining reduce muito o número de round-trips SSH por task.
pipelining = True

# ControlPersist mantém a conexão aberta entre tasks (ganho grande em loops).
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey,password

# Método de transferência de arquivos: "smart" tenta sftp e cai para scp.
# (chave moderna; a antiga `scp_if_ssh` está deprecada)
ssh_transfer_method = smart
