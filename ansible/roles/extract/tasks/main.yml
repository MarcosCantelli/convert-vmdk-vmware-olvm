---
##############################################################################
# role: extract
#
# O que faz: copia os discos da VM do ESXi e converte VMDK -> qcow2.
#
# Entrada:  variável `vm` (dict), no formato de vars/vms.yml
# Saída:    {{ vm_workdir }}/<disco>.qcow2 para cada disco listado
# Onde roda: delegado ao host de virtualização (quem tem qemu-img e o NFS)
#
# IDEMPOTÊNCIA — a role é segura para reexecutar:
#   * se o .qcow2 do disco já existe, a cópia e a conversão são puladas;
#   * a cópia usa `creates:` no arquivo de dados, então um scp interrompido
#     é retomado do zero, mas um scp concluído não é repetido.
#
# LIÇÃO APRENDIDA (migração manual): cada disco VMware são DOIS arquivos —
# o descritor `nome.vmdk` (texto, poucos KB) e os dados `nome-flat.vmdk`
# (o disco inteiro). O qemu-img só recebe o DESCRITOR, mas ele precisa
# encontrar o arquivo de dados ao lado. Copiar apenas um dos dois é o erro
# clássico: a conversão falha com "Could not open backing file".
##############################################################################

- name: "[extract] Validar a definição da VM recebida"
  ansible.builtin.assert:
    that:
      - vm is defined
      - vm.name is defined
      - vm.disks is defined
      - vm.disks | length > 0
    fail_msg: >-
      A variável `vm` precisa ter ao menos `name` e `disks`.
      Confira vars/vms.yml ou o -e vm_override passado na linha de comando.
    quiet: true

- name: "[extract] Criar o diretório de trabalho da VM no NFS"
  # Pasta IRMÃ da estrutura do oVirt. Nunca escreva dentro do diretório com
  # UUID que o oVirt gerencia: isso corrompe os metadados do storage domain.
  ansible.builtin.file:
    path: "{{ vm_workdir }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Verificar quais discos já foram convertidos"
  ansible.builtin.stat:
    path: "{{ vm_workdir }}/{{ item }}.qcow2"
  loop: "{{ vm.disks }}"
  register: extract_qcow2_stat
  changed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Mostrar o plano de extração"
  ansible.builtin.debug:
    msg: >-
      Disco '{{ item.item }}':
      {{ 'qcow2 JÁ EXISTE, será reaproveitado' if item.stat.exists
         else 'será copiado do ESXi e convertido' }}
  loop: "{{ extract_qcow2_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

# --------------------------------------------------------------------------
# GUARDA CONTRA SNAPSHOT ATIVO
#
# VM com snapshot no VMware não tem UM disco: tem uma CADEIA. O `-flat.vmdk`
# vira apenas a base, congelada no momento em que o primeiro snapshot foi
# criado, e todas as mudanças posteriores vivem nos deltas
# `nome-000001-sesparse.vmdk`, `nome-000002-...` e assim por diante.
#
# Copiar só a base "funciona": a migração termina sem erro e entrega uma VM
# que boota — com o conteúdo de meses atrás. É a pior categoria de falha,
# porque não avisa. Por isso abortamos aqui.
#
# Como resolver na origem, antes de migrar: consolide os snapshots no vCenter
# (Snapshots > Delete All / Consolidate). Depois disso sobra um único
# `-flat.vmdk` já com tudo aplicado, e a migração roda normalmente.
# --------------------------------------------------------------------------
- name: "[extract] Procurar discos de snapshot na origem"
  ansible.builtin.shell:
    cmd: >-
      {{ esxi_ssh_cmd }}
      "ls -1 '{{ esxi_vm_path }}'/*-[0-9][0-9][0-9][0-9][0-9][0-9].vmdk 2>/dev/null || true"
  register: extract_snapshots
  changed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Abortar se a VM tem snapshot ativo"
  ansible.builtin.assert:
    that: (extract_snapshots.stdout | trim | length) == 0
    fail_msg: >-
      ABORTADO: '{{ vm.name }}' tem snapshot ativo no VMware.
      Discos de delta encontrados:
      {{ extract_snapshots.stdout_lines | map('basename') | join(', ') }}.
      O disco base está congelado no momento do primeiro snapshot, e tudo que
      mudou depois está nesses deltas — migrar só a base entregaria uma VM com
      dados antigos, sem nenhum erro aparente.
      Consolide os snapshots no vCenter (Snapshots > Delete All) e rode de novo.
    quiet: true

- name: "[extract] Montar a lista de discos pendentes"
  # Uma lista simples de NOMES. As tasks seguintes iteram sobre ela, e não
  # sobre resultados de outras tasks: iterar sobre resultados aninha `item`
  # dentro de `item` e leva a erros difíceis de enxergar.
  ansible.builtin.set_fact:
    extract_pending: >-
      {{ extract_qcow2_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}

# --------------------------------------------------------------------------
# Cópia do ESXi -> NFS do host de virtualização
#
# Rodamos o scp DE DENTRO do host de virtualização (delegate_to), puxando do
# ESXi. Motivo: o ESXi é BusyBox e não executa módulos Ansible; e assim os
# dados não passam pelo runner do Jenkins.
#
# CÓPIA ATÔMICA — a razão de existir o diretório .incoming:
# o scp escreve o arquivo aos poucos. Se ele for interrompido (rede, Ctrl-C,
# uma segunda execução em paralelo), sobra um `-flat.vmdk` PARCIAL no destino
# final. Na execução seguinte o `creates:` vê esse arquivo, conclui que a
# cópia já foi feita, pula direto para a conversão e gera um qcow2 truncado.
# O sintoma aparece só lá na frente, e mentindo:
#   virt-customize: error: no operating systems were found in the guest image
#
# Copiando para .incoming e só então movendo (mv no mesmo filesystem é
# atômico), o arquivo no destino final SÓ existe quando está completo — e aí
# o `creates:` volta a dizer a verdade.
# --------------------------------------------------------------------------
- name: "[extract] Criar a área temporária de cópia"
  ansible.builtin.file:
    path: "{{ vm_workdir }}/.incoming"
    state: directory
    mode: "0755"
  when: extract_pending | length > 0
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Copiar par descritor+dados do ESXi (para a área temporária)"
  # argv (lista) em vez de linha de comando: cada elemento é um argumento
  # separado, então não precisamos de shell no host de origem.
  #
  # O prefixo esxi_scp_argv vem de group_vars/all.yml e já resolve chave SSH
  # ou sshpass, conforme esxi_use_ssh_password.
  #
  # SEM ASPAS no caminho remoto — e isso é o oposto do que fazemos no
  # precheck.yml, de propósito:
  #   * lá usamos `ssh host "cmd '/caminho'/*.vmx"`. Existe um shell remoto,
  #     que consome as aspas e protege espaços no nome.
  #   * aqui é `scp`, que interpreta o caminho pelo próprio parser, sem shell.
  #     Aspas viram PARTE DO NOME e o erro sai como
  #     `scp: '/vmfs/...': No such file or directory` — arquivo que existe.
  # ESPAÇO NO NOME funciona SEM escape nenhum, e tentar escapar QUEBRA.
  # Testado contra o ESXi: passando o caminho como um único elemento de argv,
  # o scp o entrega corretamente ao outro lado. Já `| replace(' ', '\\ ')`
  # produzia DUAS barras — porque um bloco `>-` com {{ lista }} é renderizado
  # para o repr da lista (onde \ vira \\) e reinterpretado depois. O erro
  # saía como:
  #   scp: /vmfs/.../SQL\\ V2/SQL\\ V2_5.vmdk: No such file or directory
  # Regra geral: nunca escape shell dentro de argv — não há shell para desfazer.
  ansible.builtin.command:
    argv: >-
      {{ esxi_scp_argv
         + [esxi_user ~ '@' ~ esxi_host ~ ':' ~ esxi_vm_path ~ '/' ~ item ~ '.vmdk',
            esxi_user ~ '@' ~ esxi_host ~ ':' ~ esxi_vm_path ~ '/' ~ item ~ extract_data_suffix ~ '.vmdk',
            vm_workdir ~ '/.incoming/'] }}
    creates: "{{ vm_workdir }}/{{ item }}{{ extract_data_suffix }}.vmdk"
  loop: "{{ extract_pending }}"
  delegate_to: "{{ olvm_host }}"
  async: "{{ extract_async_timeout }}"
  poll: "{{ extract_async_poll }}"
  # Só esconde a saída quando a senha está de fato no comando; com chave SSH
  # preferimos ver o log completo do scp em caso de erro.
  no_log: "{{ esxi_use_ssh_password | bool }}"

- name: "[extract] Publicar os arquivos copiados (mv atômico)"
  # Só chega aqui se o scp terminou com sucesso — se ele falhar, os arquivos
  # ficam em .incoming, o destino final continua vazio, e a próxima execução
  # recopia do zero em vez de converter um arquivo pela metade.
  ansible.builtin.command:
    argv:
      - mv
      - "{{ vm_workdir }}/.incoming/{{ item }}.vmdk"
      - "{{ vm_workdir }}/.incoming/{{ item }}{{ extract_data_suffix }}.vmdk"
      - "{{ vm_workdir }}/"
    creates: "{{ vm_workdir }}/{{ item }}{{ extract_data_suffix }}.vmdk"
  loop: "{{ extract_pending }}"
  delegate_to: "{{ olvm_host }}"

# --------------------------------------------------------------------------
# Conversão VMDK -> qcow2
# `compat=1.1` é o formato qcow2 moderno; o oVirt/QEMU atual espera isso.
# `-p` mostra progresso no log.
# --------------------------------------------------------------------------
- name: "[extract] Converter VMDK para qcow2 (compat=1.1)"
  # argv, e não linha de comando: há template cujo disco tem ESPAÇO no nome
  # ("SQL V2_5.vmdk"). Numa string, o shlex do módulo quebraria em dois
  # argumentos e o qemu-img procuraria um arquivo inexistente.
  ansible.builtin.command:
    argv:
      - qemu-img
      - convert
      - "-p"
      - "-f"
      - vmdk
      - "-O"
      - qcow2
      - "-o"
      - compat=1.1
      - "{{ vm_workdir }}/{{ item }}.vmdk"
      - "{{ vm_workdir }}/{{ item }}.qcow2"
    creates: "{{ vm_workdir }}/{{ item }}.qcow2"
  loop: "{{ extract_pending }}"
  delegate_to: "{{ olvm_host }}"
  async: "{{ extract_async_timeout }}"
  poll: "{{ extract_async_poll }}"

- name: "[extract] Remover a área temporária de cópia"
  ansible.builtin.file:
    path: "{{ vm_workdir }}/.incoming"
    state: absent
  when: extract_pending | length > 0
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Conferir o resultado da conversão"
  ansible.builtin.command:
    # argv pelo mesmo motivo da conversão: disco com espaço no nome
    # ("SQL V2_5.qcow2") viraria dois argumentos numa string, e o erro sai
    # como `qemu-img: Expecting one image file name`.
    argv:
      - qemu-img
      - info
      - "--output=json"
      - "{{ vm_workdir }}/{{ item }}.qcow2"
  loop: "{{ vm.disks }}"
  register: extract_qcow2_info
  changed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Resumo dos discos convertidos"
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}.qcow2 —
      formato={{ (item.stdout | from_json).format }},
      tamanho virtual={{ ((item.stdout | from_json)['virtual-size'] / 1073741824) | round(2) }} GiB
  loop: "{{ extract_qcow2_info.results }}"
  loop_control:
    label: "{{ item.item }}"

# --------------------------------------------------------------------------
# Limpeza opcional dos VMDK
# Mantenha desligado até validar a VM migrada: o VMDK é o seu rollback.
# --------------------------------------------------------------------------
- name: "[extract] Remover VMDKs de origem após conversão (opcional)"
  ansible.builtin.file:
    path: "{{ vm_workdir }}/{{ item.0 }}{{ item.1 }}.vmdk"
    state: absent
  # product() gera o par (disco, sufixo): remove o descritor e o arquivo
  # de dados de cada disco. Ex.: disco1.vmdk + disco1-flat.vmdk
  loop: "{{ vm.disks | product(['', extract_data_suffix]) | list }}"
  loop_control:
    label: "{{ item.0 }}{{ item.1 }}.vmdk"
  when: extract_remove_vmdk_after_convert | bool
  delegate_to: "{{ olvm_host }}"
