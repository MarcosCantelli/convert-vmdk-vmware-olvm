---
##############################################################################
# role: extract
#
# O que faz: copia os discos da VM do ESXi e converte VMDK -> qcow2.
#
# Entrada:  variável `vm` (dict), no formato de vars/vms.yml
# Saída:    {{ vm_workdir }}/<disco>.qcow2 para cada disco listado
# Onde roda: delegado ao host de virtualização (quem tem qemu-img e o NFS)
#
# IDEMPOTÊNCIA — a role é segura para reexecutar:
#   * se o .qcow2 do disco já existe, a cópia e a conversão são puladas;
#   * a cópia usa `creates:` no arquivo de dados, então um scp interrompido
#     é retomado do zero, mas um scp concluído não é repetido.
#
# LIÇÃO APRENDIDA (migração manual): cada disco VMware são DOIS arquivos —
# o descritor `nome.vmdk` (texto, poucos KB) e os dados `nome-flat.vmdk`
# (o disco inteiro). O qemu-img só recebe o DESCRITOR, mas ele precisa
# encontrar o arquivo de dados ao lado. Copiar apenas um dos dois é o erro
# clássico: a conversão falha com "Could not open backing file".
##############################################################################

- name: "[extract] Validar a definição da VM recebida"
  ansible.builtin.assert:
    that:
      - vm is defined
      - vm.name is defined
      - vm.disks is defined
      - vm.disks | length > 0
    fail_msg: >-
      A variável `vm` precisa ter ao menos `name` e `disks`.
      Confira vars/vms.yml ou o -e vm_override passado na linha de comando.
    quiet: true

- name: "[extract] Criar o diretório de trabalho da VM no NFS"
  # Pasta IRMÃ da estrutura do oVirt. Nunca escreva dentro do diretório com
  # UUID que o oVirt gerencia: isso corrompe os metadados do storage domain.
  ansible.builtin.file:
    path: "{{ vm_workdir }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Verificar quais discos já foram convertidos"
  ansible.builtin.stat:
    path: "{{ vm_workdir }}/{{ item }}.qcow2"
  loop: "{{ vm.disks }}"
  register: extract_qcow2_stat
  changed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Mostrar o plano de extração"
  ansible.builtin.debug:
    msg: >-
      Disco '{{ item.item }}':
      {{ 'qcow2 JÁ EXISTE, será reaproveitado' if item.stat.exists
         else 'será copiado do ESXi e convertido' }}
  loop: "{{ extract_qcow2_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

# --------------------------------------------------------------------------
# Cópia do ESXi -> NFS do host de virtualização
# Rodamos o scp DE DENTRO do host de virtualização (delegate_to), puxando do
# ESXi. Motivo: o ESXi é BusyBox e não executa módulos Ansible; e assim os
# dados não passam pelo runner do Jenkins.
# --------------------------------------------------------------------------
- name: "[extract] Copiar par descritor+dados do ESXi"
  # argv (lista) em vez de linha de comando: cada elemento é um argumento
  # separado, então não precisamos de shell no host de origem.
  #
  # O prefixo esxi_scp_argv vem de group_vars/all.yml e já resolve chave SSH
  # ou sshpass, conforme esxi_use_ssh_password.
  #
  # SEM ASPAS no caminho remoto — e isso é o oposto do que fazemos no
  # precheck.yml, de propósito:
  #   * lá usamos `ssh host "cmd '/caminho'/*.vmx"`. Existe um shell remoto,
  #     que consome as aspas e protege espaços no nome.
  #   * aqui é `scp`, que interpreta o caminho pelo próprio parser, sem shell.
  #     Aspas viram PARTE DO NOME e o erro sai como
  #     `scp: '/vmfs/...': No such file or directory` — arquivo que existe.
  # Consequência aceita: pasta de VM com espaço no nome não funciona por esta
  # via. Nenhuma das VMs deste ambiente tem, e o precheck avisaria antes.
  ansible.builtin.command:
    argv: >-
      {{ esxi_scp_argv
         + [esxi_user ~ '@' ~ esxi_host ~ ':' ~ esxi_vm_path ~ '/' ~ item.item ~ '.vmdk',
            esxi_user ~ '@' ~ esxi_host ~ ':' ~ esxi_vm_path ~ '/' ~ item.item ~ extract_data_suffix ~ '.vmdk',
            vm_workdir ~ '/'] }}
    creates: "{{ vm_workdir }}/{{ item.item }}{{ extract_data_suffix }}.vmdk"
  loop: "{{ extract_qcow2_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists
  delegate_to: "{{ olvm_host }}"
  async: "{{ extract_async_timeout }}"
  poll: "{{ extract_async_poll }}"
  # Só esconde a saída quando a senha está de fato no comando; com chave SSH
  # preferimos ver o log completo do scp em caso de erro.
  no_log: "{{ esxi_use_ssh_password | bool }}"

# --------------------------------------------------------------------------
# Conversão VMDK -> qcow2
# `compat=1.1` é o formato qcow2 moderno; o oVirt/QEMU atual espera isso.
# `-p` mostra progresso no log do Jenkins.
# --------------------------------------------------------------------------
- name: "[extract] Converter VMDK para qcow2 (compat=1.1)"
  ansible.builtin.command:
    cmd: >-
      qemu-img convert -p
      -f vmdk
      -O qcow2
      -o compat=1.1
      {{ vm_workdir }}/{{ item.item }}.vmdk
      {{ vm_workdir }}/{{ item.item }}.qcow2
    creates: "{{ vm_workdir }}/{{ item.item }}.qcow2"
  loop: "{{ extract_qcow2_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists
  delegate_to: "{{ olvm_host }}"
  async: "{{ extract_async_timeout }}"
  poll: "{{ extract_async_poll }}"

- name: "[extract] Conferir o resultado da conversão"
  ansible.builtin.command:
    cmd: "qemu-img info --output=json {{ vm_workdir }}/{{ item }}.qcow2"
  loop: "{{ vm.disks }}"
  register: extract_qcow2_info
  changed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[extract] Resumo dos discos convertidos"
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}.qcow2 —
      formato={{ (item.stdout | from_json).format }},
      tamanho virtual={{ ((item.stdout | from_json)['virtual-size'] / 1073741824) | round(2) }} GiB
  loop: "{{ extract_qcow2_info.results }}"
  loop_control:
    label: "{{ item.item }}"

# --------------------------------------------------------------------------
# Limpeza opcional dos VMDK
# Mantenha desligado até validar a VM migrada: o VMDK é o seu rollback.
# --------------------------------------------------------------------------
- name: "[extract] Remover VMDKs de origem após conversão (opcional)"
  ansible.builtin.file:
    path: "{{ vm_workdir }}/{{ item.0 }}{{ item.1 }}.vmdk"
    state: absent
  # product() gera o par (disco, sufixo): remove o descritor e o arquivo
  # de dados de cada disco. Ex.: disco1.vmdk + disco1-flat.vmdk
  loop: "{{ vm.disks | product(['', extract_data_suffix]) | list }}"
  loop_control:
    label: "{{ item.0 }}{{ item.1 }}.vmdk"
  when: extract_remove_vmdk_after_convert | bool
  delegate_to: "{{ olvm_host }}"
