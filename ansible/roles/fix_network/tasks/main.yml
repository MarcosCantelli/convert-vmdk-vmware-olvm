---
##############################################################################
# role: fix_network
#
# O que faz: corrige a configuração de rede DENTRO do qcow2, com a VM ainda
# desligada, usando virt-customize (libguestfs).
#
# Por que é obrigatório (lição da migração manual): o nome da interface muda
# ao sair do VMware (ens160) para o KVM (enp1s0). Se você subir a VM antes de
# corrigir, ela fica sem rede — e sem rede o Ansible não entra para corrigir.
# Consertar offline é a única forma de sair desse círculo.
#
# Entrada:  `vm` (dict) + qcow2 já produzido pela role extract
# Onde roda: delegado ao host de virtualização (quem tem virt-customize)
#
# IDEMPOTÊNCIA: gravamos um arquivo-sentinela `.<disco>.netfix.done` no
# diretório de trabalho. Se ele existe, o virt-customize é pulado.
##############################################################################

- name: "[fix_network] Verificar se o qcow2 existe antes de mexer nele"
  ansible.builtin.stat:
    path: "{{ vm_workdir }}/{{ item }}.qcow2"
  loop: "{{ fix_network_disks }}"
  register: fix_network_qcow2
  changed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[fix_network] Abortar se o disco de boot não foi convertido"
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ vm_workdir }}/{{ item.item }}.qcow2 não existe.
      Rode a role `extract` antes de `fix_network`.
    quiet: true
  loop: "{{ fix_network_qcow2.results }}"
  loop_control:
    label: "{{ item.item }}"

# --------------------------------------------------------------------------
# Preservação do IP fixo
#
# A configuração antiga CONTINUA dentro da imagem: a role só remove o
# 70-persistent-net.rules e o 50-cloud-init.yaml. Um 00-installer-config.yaml,
# por exemplo, permanece — ignorado pelo sistema, porque nomeia a interface do
# VMware, mas é ali que está o IP que a VM usava.
#
# Lemos esses arquivos com virt-cat, sem ligar a VM, e reescrevemos os mesmos
# valores amarrados ao nome NOVO da interface. Ninguém digita IP em lugar
# nenhum, e VM que tinha IP fixo continua com ele.
# --------------------------------------------------------------------------
- name: "[fix_network] Listar os arquivos de rede dentro da imagem"
  ansible.builtin.command:
    argv:
      - virt-ls
      - "-a"
      - "{{ vm_workdir }}/{{ fix_network_boot_disk }}.qcow2"
      - "{{ fix_network_guest_netplan_dir }}"
  environment:
    LIBGUESTFS_BACKEND: direct
  register: fix_network_guest_files
  changed_when: false
  # Distro sem netplan (RHEL/Oracle Linux usam NetworkManager) não tem o
  # diretório. Não é erro: apenas não há IP fixo a preservar por esta via.
  failed_when: false
  when:
    - fix_network_preserve_static | bool
    - not (fix_network_has_override | bool)
  delegate_to: "{{ olvm_host }}"

- name: "[fix_network] Ler cada arquivo de rede da imagem"
  ansible.builtin.command:
    argv:
      - virt-cat
      - "-a"
      - "{{ vm_workdir }}/{{ fix_network_boot_disk }}.qcow2"
      - "{{ fix_network_guest_netplan_dir }}/{{ item }}"
  environment:
    LIBGUESTFS_BACKEND: direct
  # Exclui o arquivo que nós mesmos geramos: numa reexecução ele já está na
  # imagem, e lê-lo criaria uma realimentação da própria configuração.
  loop: >-
    {{ (fix_network_guest_files.stdout_lines | default([]))
       | map('trim') | select('search', '\.(yaml|yml)$')
       | reject('equalto', fix_network_netplan_file) | list }}
  register: fix_network_guest_cfgs
  changed_when: false
  failed_when: false
  delegate_to: "{{ olvm_host }}"

- name: "[fix_network] Extrair o endereço fixo da configuração antiga"
  # Percorre os YAML lidos e pega a primeira interface que declara `addresses`
  # — ou seja, a que tem IP fixo. Se nenhuma tiver, o resultado é {} e o
  # template cai em DHCP, que é o comportamento seguro.
  ansible.builtin.set_fact:
    fix_network_static: >-
      {{ (fix_network_guest_cfgs.results | default([])
          | map(attribute='stdout') | select() | map('from_yaml')
          | select('mapping')
          | selectattr('network', 'defined') | map(attribute='network')
          | selectattr('ethernets', 'defined') | map(attribute='ethernets')
          | map('dict2items') | flatten | map(attribute='value')
          | selectattr('addresses', 'defined')
          | list | first) | default({}, true) }}
  when: not (fix_network_has_override | bool)

- name: "[fix_network] Usar o endereço declarado em vars/vms.yml"
  # O override manual vence a detecção: serve para MUDAR o endereço durante a
  # migração, ou para forçar DHCP numa VM (basta declarar `network: {}`).
  ansible.builtin.set_fact:
    fix_network_static: "{{ fix_network_static_override }}"
  when: fix_network_has_override | bool

- name: "[fix_network] Anunciar o modo de rede escolhido"
  ansible.builtin.debug:
    msg: >-
      {{ ('IP FIXO preservado: ' ~ (fix_network_static.addresses | join(', ')))
         if fix_network_static
         else 'DHCP — nenhum endereço fixo encontrado na imagem (ou forçado por vars/vms.yml)' }}

- name: "[fix_network] Gerar o netplan no host de virtualização"
  ansible.builtin.template:
    src: 99-migracao-netcfg.yaml.j2
    dest: "{{ vm_workdir }}/{{ fix_network_netplan_file }}"
    mode: "0644"
  delegate_to: "{{ olvm_host }}"

- name: "[fix_network] Injetar a configuração de rede no qcow2 (offline)"
  # Notas sobre o comando:
  #
  # LIBGUESTFS_BACKEND=direct — sem isso o libguestfs tenta usar libvirt e
  #   falha por permissão/rede no host oVirt. É o ajuste que faz o
  #   virt-customize funcionar num host de virtualização gerenciado.
  #
  # --upload origem:destino — copia o netplan para dentro da imagem.
  #
  # DESATIVAMOS renomeando, em vez de apagar. Netplan e udev só leem arquivos
  #   com a extensão certa, então o `.migracao-bak` já basta para tirá-los de
  #   circulação — e o conteúdo continua disponível dentro da VM.
  #   Numa VM instalada pelo subiquity, a rede vive no 50-cloud-init.yaml:
  #   apagá-lo destruía a única cópia do endereço original.
  #   O `; true` no fim garante saída zero mesmo quando nenhum arquivo existe.
  #
  # `netplan generate || true` valida a sintaxe já dentro da imagem; o
  #   `|| true` evita quebrar a migração em distros sem netplan (RHEL/Oracle
  #   Linux usam NetworkManager e simplesmente ignoram o arquivo).
  #
  # O loop percorre `fix_network_disks` (nomes de disco), e NÃO o resultado do
  # stat acima. Iterar sobre resultados de outra task aninha `item` dentro de
  # `item` e a task seguinte precisaria de `item.item.item` para chegar ao
  # nome — receita de erro. Aqui `item` é simplesmente o nome do disco.
  ansible.builtin.command:
    argv:
      - virt-customize
      - "-a"
      - "{{ vm_workdir }}/{{ item }}.qcow2"
      - "--upload"
      - "{{ vm_workdir }}/{{ fix_network_netplan_file }}:/etc/netplan/{{ fix_network_netplan_file }}"
      - "--run-command"
      - "chmod 0600 /etc/netplan/{{ fix_network_netplan_file }} || true"
      - "--run-command"
      - >-
        for f in {{ fix_network_disable_files | join(' ') }}; do
        [ -e "$f" ] && mv "$f" "$f{{ fix_network_backup_suffix }}"; done; true
      - "--run-command"
      - "netplan generate || true"
  environment:
    LIBGUESTFS_BACKEND: direct
  args:
    creates: "{{ vm_workdir }}/.{{ item }}.netfix.done"
  loop: "{{ fix_network_disks }}"
  register: fix_network_result
  delegate_to: "{{ olvm_host }}"
  async: "{{ fix_network_timeout }}"
  poll: 15

- name: "[fix_network] Marcar o disco como já ajustado (sentinela)"
  # noqa: no-handler
  # Não é caso de handler: a sentinela é por DISCO (o loop percorre a lista) e
  # precisa ser gravada imediatamente após o ajuste daquele disco, não ao fim
  # do play. Handler rodaria uma vez só, no final, e perderia a granularidade.
  ansible.builtin.file:
    path: "{{ vm_workdir }}/.{{ item.item }}.netfix.done"
    state: touch
    mode: "0644"
  loop: "{{ fix_network_result.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item is changed
  delegate_to: "{{ olvm_host }}"

- name: "[fix_network] Lembrete sobre a configuração definitiva"
  ansible.builtin.debug:
    msg: >-
      Rede da VM '{{ vm.name }}' ajustada para DHCP genérico (match en*).
      Depois do primeiro boot, aplique a configuração de rede definitiva
      (IP fixo etc.) — este netplan é apenas a rede de segurança da migração.
