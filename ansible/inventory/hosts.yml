##############################################################################
# inventory/hosts.yml — topologia real do ambiente.
#
# Papéis de cada grupo:
#
#   olvm_hosts  -> host de virtualização (KVM). É AQUI que todo o trabalho
#                  pesado acontece, porque é o único que tem `qemu-img`,
#                  `ovirt-img`, `virt-customize` e o SDK Python do oVirt.
#                  Todas as roles usam `delegate_to` para este host.
#
#   olvm_engine -> o hosted-engine (API REST / Keycloak). Não executamos
#                  playbooks nele; está no inventário para documentação e
#                  para eventuais tarefas de manutenção do certificado.
#
#   esxi        -> origem VMware. O ESXi roda BusyBox, sem Python utilizável,
#                  então SÓ falamos com ele pelo módulo `raw` (precheck) ou
#                  por `scp` disparado de dentro do olvm_host.
#
# Lembrete de DNS: a zona mvrc.local vive num BIND9 que o roteador não
# encaminha. Garanta a entrada em /etc/hosts do runner do Jenkins:
#   192.168.31.9   olvm.mvrc.local olvm
##############################################################################

all:
  children:

    # O "controller" é onde os playbooks de migração rodam (o runner do
    # Jenkins ou a sua estação). Ele aparece EXPLICITAMENTE no inventário de
    # propósito: o localhost implícito do Ansible não herda group_vars/all.yml,
    # e perderíamos toda a configuração do ambiente.
    controller:
      hosts:
        localhost:
          ansible_connection: local

    olvm_hosts:
      hosts:
        olvm-host-01:
          ansible_host: 192.168.31.11
          ansible_user: root
          # NFS de 2 TB montado aqui — é onde fica migracao_workdir.
          nfs_mount: /mnt/sd1

    olvm_engine:
      hosts:
        olvm-engine:
          ansible_host: 192.168.31.9
          ansible_user: root
          engine_fqdn: olvm.mvrc.local

    esxi:
      hosts:
        esxi-01:
          ansible_host: 192.168.31.12
          # PLACEHOLDER: confirme o usuário SSH do seu ESXi (assumido root).
          ansible_user: root
          # O shell do ESXi não tem Python usável para módulos Ansible.
          # Use apenas o módulo `raw` contra este host.
          ansible_python_interpreter: /bin/false
          ansible_shell_type: sh
          esxi_datastore: VS2_HD2_1TB
