  # =========================================================================
  # WINDOWS — comentadas de propósito. NÃO descomente sem ler o porquê.
  #
  # (a) DRIVERS VIRTIO. Uma VM Windows que vem do VMware não tem driver
  #     virtio. Se o disco de boot for anexado como virtio_scsi, o Windows
  #     sobe e para em INACCESSIBLE_BOOT_DEVICE. Por isso as três abaixo têm
  #     disk_interface: sata e nic_interface: e1000 — hardware que o Windows
  #     reconhece nativamente. Depois do primeiro boot: instale o
  #     virtio-win (ISO do Fedora/oVirt), e só então troque para virtio_scsi
  #     e virtio, um de cada vez.
  #
  # (b) fix_network: false. A role fix_network injeta netplan, que é coisa de
  #     Linux — em imagem Windows não serve para nada. A rede do Windows se
  #     ajusta depois do boot, pelo console.
  #
  # (c) FIRMWARE UEFI, confirmado no precheck: as três têm firmware = "efi"
  #     no .vmx, então bios_type q35_ovmf. Firmware errado faz a VM ligar sem
  #     achar o disco de boot.
  #
  # (d) VLAN_AD. Win_Server_SQL_LAB e WinServer22_AD têm uma SEGUNDA placa na
  #     VLAN_AD, que ainda não existe no OLVM. A role create_vm cria apenas
  #     UMA placa (ovirtmgmt). Enquanto a VLAN não for criada, migrar essas
  #     duas produziria uma VM incompleta — e você mencionou que talvez vá
  #     refazê-las do zero. Decida isso antes de descomentar.
  # =========================================================================

