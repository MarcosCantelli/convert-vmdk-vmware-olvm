##############################################################################
# vars/vms.yml — inventário das VMs a migrar do vCenter/ESXi para o OLVM.
#
# Fila de trabalho: migrate-batch.yml percorre a lista; migrate-single.yml
# procura uma VM pelo nome (-e vm_name=...).
#
# Campos de cada VM:
#   name              (obrigatório) nome final da VM no oVirt
#   esxi_folder       pasta da VM dentro do datastore (default: = name)
#   disks             (obrigatório) discos SEM extensão; o PRIMEIRO é o de boot.
#                     Para nome.vmdk + nome-flat.vmdk, escreva só "nome".
#   firmware          bios | uefi  -> DESCUBRA COM precheck.yml
#   operating_system  ID do SO no oVirt (veja a nota no fim do arquivo)
#   cpu_sockets / cpu_cores / cpu_threads
#   memory_gib        memória em GiB
#   disk_interface    override; virtio_scsi (Linux) | sata (Windows sem virtio)
#   nic_interface     override; virtio (Linux) | e1000 (Windows sem virtio)
#   fix_network       true = virt-customize offline (só faz sentido em Linux)
#   network           opcional; veja "IP FIXO" abaixo
#   storage_domain    opcional, sobrescreve ovirt_storage_domain
#
# ---------------------------------------------------------------------------
# IP FIXO — por padrão é PRESERVADO, sem você declarar nada
# ---------------------------------------------------------------------------
# A role fix_network lê o netplan que já existe DENTRO do qcow2 (virt-cat, com
# a VM desligada) e reescreve o mesmo endereço, gateway e DNS amarrados ao nome
# NOVO da interface. VM que tinha IP fixo continua com ele; VM que usava DHCP
# continua em DHCP. Nada a configurar.
#
# Use o campo `network` só quando quiser MUDAR algo na migração:
#
#   network:                                  # trocar o endereço
#     addresses: ["192.168.31.50/24"]
#     routes:
#       - to: default
#         via: 192.168.31.1
#     nameservers:
#       addresses: ["192.168.31.9"]
#
#   network: {}                               # forçar DHCP nesta VM
#
# Lembre que a VM ganha MAC NOVO no oVirt: reserva de DHCP amarrada ao MAC
# antigo deixa de valer, e registro no BIND9 continua apontando para o
# endereço antigo se você mudar o IP.
#
# ---------------------------------------------------------------------------
# ORIGEM DOS DADOS DESTE ARQUIVO (tudo verificado, nada suposto)
# ---------------------------------------------------------------------------
# * datastore e pasta -> `vim-cmd vmsvc/getallvms` no ESXi
# * firmware, CPU, memória, SO e nomes de disco -> `ansible-playbook precheck.yml`
#
# FIRMWARE: as 6 Linux são BIOS (nenhum .vmx tem a linha `firmware` — o VMware
# só a escreve quando é EFI); as 3 Windows são UEFI (firmware = "efi").
# Ao acrescentar uma VM nova aqui, rode o precheck antes: firmware errado faz a
# VM ligar sem achar o disco de boot. O precheck também avisa sobre SNAPSHOT
# ativo, que é a outra armadilha silenciosa.
#
# Repare no caso MySQL_HO: a VM se chama MySQL_HO (underscore) mas mora na
# pasta MySQL-HO (hífen). VM renomeada no vCenter mantém o nome ANTIGO nos
# arquivos — é por isso que `esxi_folder` existe.
##############################################################################

vms:

  # =========================================================================
  # UBUNTU SERVER 24.04 — dados confirmados no precheck, prontas para migrar
  # =========================================================================

  # Ubuntu 24.04.4 · disco 20 GB (confirmado no precheck)
  - name: App-Server-HO
    esxi_datastore: VS2_HD2_1TB
    esxi_folder: App-Server-HO
    disks:
      - App-Server-HO
    firmware: bios              # CONFIRMADO: .vmx sem linha firmware = BIOS
    operating_system: other_linux
    cpu_sockets: 1
    cpu_cores: 2
    cpu_threads: 1
    memory_gib: 4
    fix_network: true

