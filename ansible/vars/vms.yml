  #   disk_interface: sata        # até instalar o virtio-win
  #   nic_interface: e1000        # até instalar o virtio-win
  #   fix_network: false          # netplan não existe no Windows

  # - name: Win_Server_SQL_LAB
  #   esxi_datastore: VS2_HD1_1TB
  #   esxi_folder: Win_Server_SQL_LAB
  #   # BLOQUEADA POR DOIS MOTIVOS:
  #   # 1) SNAPSHOTS ATIVOS. A VM tem uma cadeia de dois:
  #   #      base 40 GB -> -000001 (8,8 GB, "SQL SERVER STL", set/2025)
  #   #                 -> -000002 (7,3 GB, "SQL STL v2",     dez/2025)
  #   #    O -flat.vmdk é só a base, congelada em setembro. Migrar assim
  #   #    entregaria dados de meses atrás sem nenhum erro aparente — por isso
  #   #    a role extract ABORTA se encontrar discos de delta.
  #   #    Consolide no vCenter (Snapshots > Delete All) antes de migrar.
  #   # 2) tem 2ª placa na VLAN_AD, que ainda não existe no OLVM.
  #   disks:
  #     - Win_Server_SQL_LAB
  #   firmware: uefi              # CONFIRMADO: .vmx tem firmware = "efi"
  #   operating_system: other     # guestOS = windows9srv-64
  #   cpu_sockets: 1
  #   cpu_cores: 2
  #   cpu_threads: 1
  #   memory_gib: 8
  #   disk_interface: sata
  #   nic_interface: e1000
